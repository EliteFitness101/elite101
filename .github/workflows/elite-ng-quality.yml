name: Elite NG quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/elite-ng-questionnaire-production"]

permissions:
  contents: read

concurrency:
  group: elite-ng-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test -- --passWithNoTests
      - name: Production build
        run: npm run build
